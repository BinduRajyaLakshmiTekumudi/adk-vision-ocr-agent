<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Healthy Hints</title>
  <style>
    :root { --bg: #f7f7f5; --card: #fff; --text: #1d1d1b; --muted: #6b6b66; --accent: #1a7f4b; --line: #e3e2dd; --err: #b42318; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #161615; --card: #1f1f1d; --text: #ecebe6; --muted: #a3a29c; --accent: #4cc38a; --line: #34332f; --err: #f97066; }
    }
    * { box-sizing: border-box; }
    body { margin: 0; font: 16px/1.55 system-ui, -apple-system, Segoe UI, sans-serif; background: var(--bg); color: var(--text); }
    main { max-width: 760px; margin: 0 auto; padding: 32px 16px 64px; }
    h1 { font-size: 1.6rem; margin: 0 0 4px; }
    p.lead { color: var(--muted); margin: 0 0 24px; }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 20px; }
    label.drop { display: block; border: 2px dashed var(--line); border-radius: 10px; padding: 28px; text-align: center; cursor: pointer; color: var(--muted); }
    label.drop:hover { border-color: var(--accent); }
    input[type=file] { display: none; }
    img#preview { display: none; max-width: 100%; max-height: 280px; margin: 16px auto 0; border-radius: 8px; }
    button { margin-top: 16px; width: 100%; padding: 12px; font: inherit; font-weight: 600; color: #fff; background: var(--accent); border: 0; border-radius: 8px; cursor: pointer; }
    button:disabled { opacity: .55; cursor: wait; }
    #status { margin-top: 12px; color: var(--muted); min-height: 1.5em; }
    #status.err { color: var(--err); }
    #result { display: none; margin-top: 20px; }
    #result code { font-size: .85rem; word-break: break-all; color: var(--muted); }
    #analysis { white-space: pre-wrap; margin-top: 12px; }
  </style>
</head>
<body>
<main>
  <h1>Healthy Hints</h1>
  <p class="lead">Upload a photo of a food label. The agent stores it in Cloud Storage, reads it with Cloud Vision OCR, and explains the ingredients.</p>

  <div class="card">
    <form id="form">
      <label class="drop" for="file"><span id="fileLabel">Choose a JPG, PNG, or WebP image (max 8 MiB)</span></label>
      <input id="file" name="file" type="file" accept="image/jpeg,image/png,image/webp" required>
      <img id="preview" alt="Selected label">
      <button id="submit" type="submit" disabled>Analyze label</button>
      <div id="status"></div>
    </form>
  </div>

  <div id="result" class="card">
    <strong>Stored at</strong> <code id="uri"></code>
    <div id="analysis"></div>
  </div>
</main>

<script>
  const fileInput = document.getElementById("file");
  const preview = document.getElementById("preview");
  const submit = document.getElementById("submit");
  const statusBox = document.getElementById("status");

  fileInput.addEventListener("change", () => {
    const f = fileInput.files[0];
    submit.disabled = !f;
    if (!f) return;
    document.getElementById("fileLabel").textContent = f.name;
    preview.src = URL.createObjectURL(f);
    preview.style.display = "block";
  });

  document.getElementById("form").addEventListener("submit", async (e) => {
    e.preventDefault();
    submit.disabled = true;
    statusBox.className = "";
    statusBox.textContent = "Uploading and analyzing... this can take 10 to 30 seconds.";
    document.getElementById("result").style.display = "none";

    const body = new FormData();
    body.append("file", fileInput.files[0]);
    try {
      const res = await fetch("/analyze", { method: "POST", body });
      const data = await res.json();
      if (!res.ok) throw new Error(data.detail || "Request failed");
      document.getElementById("uri").textContent = data.gcs_uri;
      document.getElementById("analysis").textContent = data.analysis;
      document.getElementById("result").style.display = "block";
      statusBox.textContent = "";
    } catch (err) {
      statusBox.className = "err";
      statusBox.textContent = err.message;
    } finally {
      submit.disabled = false;
    }
  });
</script>
</body>
</html>
