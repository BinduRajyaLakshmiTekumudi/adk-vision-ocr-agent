<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Healthy Hints</title>
  <style>
    :root { --bg: #f7f7f5; --card: #fff; --text: #1d1d1b; --muted: #6b6b66; --accent: #1a7f4b; --line: #e3e2dd; --err: #b42318; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #161615; --card: #1f1f1d; --text: #ecebe6; --muted: #a3a29c; --accent: #4cc38a; --line: #34332f; --err: #f97066; }
    }
    * { box-sizing: border-box; }
    body { margin: 0; font: 16px/1.55 system-ui, -apple-system, Segoe UI, sans-serif; background: var(--bg); color: var(--text); }
    main { max-width: 760px; margin: 0 auto; padding: 32px 16px 64px; }
    h1 { font-size: 1.6rem; margin: 0 0 4px; }
    p.lead { color: var(--muted); margin: 0 0 24px; }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 20px; }
    label.drop { display: block; border: 2px dashed var(--line); border-radius: 10px; padding: 28px; text-align: center; cursor: pointer; color: var(--muted); }
    label.drop:hover { border-color: var(--accent); }
    input[type=file] { display: none; }
    img#preview { display: none; max-width: 100%; max-height: 280px; margin: 16px auto 0; border-radius: 8px; }
    button { margin-top: 16px; width: 100%; padding: 12px; font: inherit; font-weight: 600; color: #fff; background: var(--accent); border: 0; border-radius: 8px; cursor: pointer; }
    button:disabled { opacity: .55; cursor: wait; }
    #status { margin-top: 12px; color: var(--muted); min-height: 1.5em; }
    #status.err { color: var(--err); }
    #result { display: none; margin-top: 20px; }
    #result code { font-size: .85rem; word-break: break-all; color: var(--muted); }
    #analysis { margin-top: 12px; }
    #analysis h1, #analysis h2, #analysis h3 { font-size: 1.1rem; margin: 20px 0 8px; }
    #analysis ul { padding-left: 22px; }
    #analysis li { margin: 4px 0; }
    #analysis blockquote { margin: 8px 0; padding: 4px 12px; border-left: 3px solid var(--line); color: var(--muted); }
    #analysis hr { border: 0; border-top: 1px solid var(--line); margin: 20px 0; }
  </style>
</head>
<body>
<main>
  <h1>Healthy Hints</h1>
  <p class="lead">Upload a photo of a food label. The agent stores it in Cloud Storage, reads it with Cloud Vision OCR, and explains the ingredients.</p>

  <div class="card">
    <form id="form">
      <label class="drop" for="file"><span id="fileLabel">Choose a JPG, PNG, or WebP image (max 8 MiB)</span></label>
      <input id="file" name="file" type="file" accept="image/jpeg,image/png,image/webp" required>
      <img id="preview" alt="Selected label">
      <button id="submit" type="submit" disabled>Analyze label</button>
      <div id="status"></div>
    </form>
  </div>

  <div id="result" class="card">
    <strong>Stored at</strong> <code id="uri"></code>
    <div id="analysis"></div>
  </div>
</main>

<script>
  // Minimal markdown renderer for the agent's replies: headings, bold, italics,
  // bullet lists (one nesting level), quotes, rules and paragraphs.
  // All text is HTML-escaped first, so model output can never inject markup.
  function escapeHtml(s) {
    return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  }
  function inline(s) {
    return escapeHtml(s)
      .replace(/`([^`]+)`/g, "<code>$1</code>")
      .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
      .replace(/(^|[^*])\*([^*\s][^*]*)\*/g, "$1<em>$2</em>");
  }
  function renderMarkdown(md) {
    const out = [];
    let listDepth = 0, para = [];
    const flushPara = () => { if (para.length) { out.push("<p>" + para.map(inline).join("<br>") + "</p>"); para = []; } };
    const closeLists = (to) => { while (listDepth > to) { out.push("</ul>"); listDepth--; } };
    for (const raw of md.replace(/\r/g, "").split("\n")) {
      const line = raw.replace(/\s+$/, "");
      const bullet = line.match(/^(\s*)[*-]\s+(.*)$/);
      const heading = line.match(/^#{1,6}\s+(.*)$/);
      if (!line.trim()) { flushPara(); closeLists(0); continue; }
      if (/^\s*(-{3,}|\*{3,})\s*$/.test(line)) { flushPara(); closeLists(0); out.push("<hr>"); continue; }
      if (heading) { flushPara(); closeLists(0); out.push("<h3>" + inline(heading[1]) + "</h3>"); continue; }
      if (bullet) {
        flushPara();
        const depth = bullet[1].length >= 2 ? 2 : 1;
        while (listDepth < depth) { out.push("<ul>"); listDepth++; }
        closeLists(depth);
        out.push("<li>" + inline(bullet[2]) + "</li>");
        continue;
      }
      if (line.startsWith(">")) { flushPara(); closeLists(0); out.push("<blockquote>" + inline(line.replace(/^>\s?/, "")) + "</blockquote>"); continue; }
      closeLists(0);
      para.push(line.trim());
    }
    flushPara(); closeLists(0);
    return out.join("\n");
  }

  const fileInput = document.getElementById("file");
  const preview = document.getElementById("preview");
  const submit = document.getElementById("submit");
  const statusBox = document.getElementById("status");

  fileInput.addEventListener("change", () => {
    const f = fileInput.files[0];
    submit.disabled = !f;
    if (!f) return;
    document.getElementById("fileLabel").textContent = f.name;
    preview.src = URL.createObjectURL(f);
    preview.style.display = "block";
  });

  document.getElementById("form").addEventListener("submit", async (e) => {
    e.preventDefault();
    submit.disabled = true;
    statusBox.className = "";
    statusBox.textContent = "Uploading and analyzing... this can take 10 to 30 seconds.";
    document.getElementById("result").style.display = "none";

    const body = new FormData();
    body.append("file", fileInput.files[0]);
    try {
      const res = await fetch("/analyze", { method: "POST", body });
      const data = await res.json();
      if (!res.ok) throw new Error(data.detail || "Request failed");
      document.getElementById("uri").textContent = data.gcs_uri;
      document.getElementById("analysis").innerHTML = renderMarkdown(data.analysis);
      document.getElementById("result").style.display = "block";
      statusBox.textContent = "";
    } catch (err) {
      statusBox.className = "err";
      statusBox.textContent = err.message;
    } finally {
      submit.disabled = false;
    }
  });
</script>
</body>
</html>
